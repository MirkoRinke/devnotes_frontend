@let translatePath = 'PostContainer' + '.';

<div
  class="post-container"
  [class.is-fluid]="isFluid()"
>
  @if (postDataLoaded) {
    @if (mode === 'view') {
      <app-post-view
        [context]="context"
        [endPoint]="endPoint"
        [selectedEntity]="selectedEntity"
        [selectedEntityValue]="selectedEntityValue"
        [selectedPostType]="selectedPostType"
        [post]="post"
        (modeChange)="mode = $event"
        (resourceRefreshRequest)="updatePost()"
      ></app-post-view>
    } @else if (mode === 'edit') {
      <app-post-form
        [mode]="mode"
        [post]="post"
        (modeChange)="mode = $event"
        (resourceRefresh)="updatePost($event)"
      ></app-post-form>
    }
  } @else {
    <app-loading [inputTranslatePath]="translatePath"></app-loading>
  }
</div>
