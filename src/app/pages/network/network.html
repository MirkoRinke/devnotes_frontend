@let translatePath = 'Network' + '.';
<!-- @let translatePathAriaLabel = translatePath + 'ariaLabel' + '.'; -->

@if (authService.isLoggedIn()) {
  <app-action-placeholder
    class="center"
    [parentTranslatePathInput]="translatePath + 'actionPlaceholder' + '.' + 'loggedIn' + '.'"
    [features]="{ enableTitle: true, enableMessage: true, enableButton: true }"
    [buttonLink]="'/community'"
    [returnIcon]="'network_duck'"
  ></app-action-placeholder>
} @else {
  <app-action-placeholder
    class="center translate-animation-left"
    [parentTranslatePathInput]="translatePath + 'actionPlaceholder' + '.' + 'notLoggedIn' + '.'"
    [features]="{ enableTitle: true, enableMessage: true, enableButton: true }"
    [buttonLink]="'/login'"
    [returnIcon]="'not_logged_in_duck'"
  ></app-action-placeholder>
}
