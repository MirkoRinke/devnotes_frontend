@let translatePath = 'HomeButton' + '.';
@let translatePathAriaLabel = translatePath + 'ariaLabel' + '.';

<a
  class="home-button"
  [routerLink]="'/'"
  type="button"
  [attr.aria-label]="translatePathAriaLabel + 'goToHome' | translate"
>
  <span
    class="icon"
    [innerHTML]="svgIconsService.returnIcon('home')"
  ></span>
</a>
