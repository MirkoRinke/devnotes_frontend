@if (display != null && display.label != null && display.defaultValue != null && mode != null) {
  <div
    class="dropdown-component"
    appClickOutsideDirective
    [clickOutsideEnabled]="showDropdownValues"
    (clickOutside)="closeDropdown()"
  >
    <div class="dropdown">
      <button
        type="button"
        [class.active]="filteredValues.length > 0"
        (click)="toggleDropdown()"
        aria-haspopup="listbox"
      >
        <span class="label"> {{ display.label }}: </span>

        <span class="selected-value">
          {{ selectedLabel ?? 'Alle' }}
        </span>
        <span
          class="chevron-icon"
          [class.active]="filteredValues.length > 0"
          [innerHTML]="svgIconsService.returnIcon('chevron')"
          [class.open]="showDropdownValues"
        ></span>
      </button>
    </div>

    @if (showDropdownValues) {
      <div
        class="values"
        [class.active]="showDropdownValues"
        [class.animated-in]="showAnimation"
        [class.animated-out]="!showAnimation"
        (animationend)="onAnimationEnd($event)"
        role="listbox"
      >
        @if (features.enableSearch) {
          <input
            type="text"
            class="search-input"
            placeholder="Search.."
            (input)="filterFunction($event.target.value)"
          />
        }

        @if (display.defaultValue !== '' && features.enableAllOption) {
          <button
            type="button"
            role="option"
            class="value"
            (click)="select('')"
          >
            <span class="name">Alle {{ display.label }}</span>

            @if (features.showCount) {
              <span class="count">{{ totalCount > 0 ? totalCount : '' }}</span>
            }
          </button>
        }
        @for (value of filteredValues; track $index) {
          <button
            type="button"
            role="option"
            class="value"
            [title]="value.name"
            (click)="select(value.name)"
          >
            <span class="name">{{ values && values[value.name] ? values[value.name] : value.name }}</span>
            @if (features.showCount) {
              <span class="count">{{ value.total_counts ? value.total_counts : '' }}</span>
            }
          </button>
        }
      </div>
    }
  </div>
}
