@let translatePath = 'TechTile' + '.';
@let translatePathAriaLabel = translatePath + 'ariaLabel' + '.';

@if (tile && endPoint && context) {
  <div class="tech-tile">
    <a
      class="tile"
      [routerLink]="'/post-types-selection'"
      [queryParams]="{ context: context, endPoint: endPoint, entity: tile.entity, entityValue: tile.name }"
    >
      <header class="header">
        <span class="count">{{ tile.total_counts }}</span>
      </header>
      <div class="content">
        <span
          class="container"
          [innerHTML]="svgIconsService.returnIcon(tile.name, 'tile-icon')"
        ></span>
      </div>
      <div class="footer">
        <span class="name">{{ tile.name }}</span>
      </div>
    </a>
    @if (authService.isLoggedIn()) {
      <button
        class="favorite-icon-container"
        (click)="$event.stopPropagation(); toggleFavorite($event, tile)"
        [attr.aria-label]="isFavorite ? (translatePathAriaLabel + 'removeFromFavorites' | translate) : (translatePathAriaLabel + 'addToFavorites' | translate)"
      >
        <span
          class="icon-container"
          [class.active]="isFavorite"
          [innerHTML]="svgIconsService.returnIcon(isFavorite ? 'favorite' : 'favorite_outline', 'favorite')"
          aria-hidden="true"
        ></span>
      </button>
    }
  </div>
}
