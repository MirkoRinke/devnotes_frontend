@let translatePath = 'ContentUserMenu' + '.';

@if (user) {
  <div
    class="values"
    [id]="menuId"
    role="menu"
    [class.active]="menuOpen"
    [class.animated-in]="menuAnimating"
    [class.animated-out]="!menuAnimating"
    (animationend)="onAnimationEnd($event)"
    appRovingFocusDirective
    [appInputFocusElements]="'[role=menuitem]'"
    appAutoFocusDirective
  >
    <a
      class="value"
      role="menuitem"
      [routerLink]="['/user-profile', user.id]"
      (click)="onClose()"
      appAutoFocusTarget
    >
      {{ isOwner(user) ? (translatePath + 'myProfile' | translate) : (translatePath + 'viewProfile' | translate) }}
    </a>

    @if (!isOwner(user)) {
      @if (isLoggedIn()) {
        <button
          class="value"
          role="menuitem"
          type="button"
          [disabled]="isProcessingFollow"
          (click)="toggleFollowUser(user); onClose()"
        >
          {{ user.is_following ? (translatePath + 'unfollow' | translate) : (translatePath + 'follow' | translate) }}
        </button>
      } @else {
        <a
          class="value"
          role="menuitem"
          [routerLink]="['/login']"
          (click)="onClose()"
        >
          {{ translatePath + 'follow' | translate }}
        </a>
      }

      <span
        class="divider"
        role="separator"
      ></span>

      <button
        class="value"
        role="menuitem"
        type="button"
        (click)="reportUser(); onClose()"
      >
        {{ translatePath + 'report' | translate }}
      </button>
    }
  </div>
}
