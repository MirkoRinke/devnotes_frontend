@let translatePath = 'ContentUserBadge' + '.';
@let translatePathAriaLabel = translatePath + 'ariaLabel' + '.';

@if (user) {
  @if (reportModalOpen) {
    <app-report-modal
      class="overlay"
      [reportId]="user.id"
      [reportContext]="'user'"
      [class.open]="reportModalAnimating"
      [class.closed]="!reportModalAnimating"
      (click)="closeReportModal()"
      (animationend)="onAnimationEnd($event)"
      (closeModal)="closeReportModal()"
    ></app-report-modal>
  }

  <div
    class="content-user-badge"
    appClickOutsideDirective
    [clickOutsideEnabled]="menuOpen"
    (clickOutside)="triggerCloseBadgeMenu()"
  >
    <button
      class="user-badge"
      [class.active]="menuActive"
      [disabled]="!menuActive"
      #toggleButton
      (click)="toggleBadgeMenu()"
      type="button"
      appEscapeCloseDirective
      [appEscapeCloseEnabled]="menuOpen"
      [appEscapeClose]="toggleButton"
      (escapePressed)="triggerCloseBadgeMenu()"
      [attr.aria-label]="translatePathAriaLabel + 'userBadge' | translate: { name: user.display_name ?? '' }"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-haspopup]="'menu'"
      [attr.aria-controls]="menuOpen ? menuId : null"
    >
      <app-avatar-layer
        [menuOpen]="menuOpen"
        [avatarMvpId]="user.avatar_mvp_id ?? null"
      ></app-avatar-layer>
      <span
        class="display-name"
        [attr.title]="user.display_name"
        >{{ user.display_name }}</span
      >
    </button>

    @if (menuActive && menuOpen) {
      <app-content-user-menu
        [user]="user"
        [menuId]="menuId"
        [menuOpen]="menuOpen"
        [menuAnimating]="menuAnimating"
        (closeMenu)="closeBadgeMenu()"
        (openReportModal)="openReportModal()"
      ></app-content-user-menu>
    }
  </div>
}
