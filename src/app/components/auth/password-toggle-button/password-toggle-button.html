@let translatePath = 'PasswordToggleButton' + '.';
@let translatePathAriaLabel = translatePath + 'ariaLabel' + '.';

<button
  type="button"
  class="password-toggle-button"
  (mousedown)="$event.preventDefault(); togglePasswordVisibility()"
  (click)="togglePasswordVisibility()"
  [attr.aria-label]="isPasswordVisible ? (translatePathAriaLabel + 'hidden' | translate) : (translatePathAriaLabel + 'visible' | translate)"
>
  <span
    class="icon-container"
    [innerHTML]="svgIconsService.returnIcon(isPasswordVisible ? 'eye_closed' : 'eye_open', 'eye')"
    aria-hidden="true"
  ></span>
</button>
