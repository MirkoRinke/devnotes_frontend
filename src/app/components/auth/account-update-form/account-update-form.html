@let translatePath = 'AccountUpdate' + '.';
@let translatePathAriaLabel = translatePath + 'ariaLabel' + '.';

@if (accountSettingsForm !== null) {
  <section class="account-update">
    <header class="header">
      <div class="heading-wrapper">
        <h1 class="heading">{{ translatePath + 'heading' | translate }}</h1>
        <h2 class="subheading">{{ translatePath + 'subheading' | translate }}</h2>
      </div>
    </header>
    <div class="global-message-wrapper">
      <app-badge
        class="badge"
        [messages]="messages['accountSettings']"
        [caret]="'none'"
      ></app-badge>
    </div>

    <form
      class="form"
      [formGroup]="accountSettingsForm"
    >
      <div class="input-row">
        <div class="input-container">
          <app-badge
            class="badge"
            id="name-badge"
            [messages]="isInvalid('name') ? messages['name'] : null"
            [caret]="'left'"
          ></app-badge>

          <input
            class="input"
            type="text"
            name="name"
            formControlName="name"
            maxlength="40"
            spellcheck="false"
            autocomplete="username"
            [placeholder]="translatePath + 'username' | translate"
            [attr.aria-label]="translatePathAriaLabel + 'username' | translate"
            [attr.aria-describedby]="isInvalid('name') ? 'name-badge' : null"
            [attr.aria-invalid]="isInvalid('name')"
          />
        </div>
      </div>

      <div class="input-row">
        <div class="input-container">
          <app-badge
            class="badge"
            id="email-badge"
            [messages]="isInvalid('email') ? messages['email'] : null"
            [caret]="'left'"
          ></app-badge>

          <input
            class="input"
            type="text"
            name="email"
            formControlName="email"
            spellcheck="false"
            autocomplete="email"
            [placeholder]="translatePath + 'email' | translate"
            [attr.aria-label]="translatePathAriaLabel + 'email' | translate"
            [attr.aria-describedby]="isInvalid('email') ? 'email-badge' : null"
            [attr.aria-invalid]="isInvalid('email')"
          />
        </div>

        <div class="input-container">
          <app-badge
            class="badge"
            id="email-confirmation-badge"
            [messages]="emailConfirmationErrorMessage"
            [caret]="'left'"
          ></app-badge>

          <input
            class="input"
            type="text"
            name="email_confirmation"
            formControlName="email_confirmation"
            spellcheck="false"
            autocomplete="email"
            [placeholder]="translatePath + 'emailConfirmation' | translate"
            [attr.aria-label]="translatePathAriaLabel + 'emailConfirmation' | translate"
            [attr.aria-describedby]="emailConfirmationErrorMessage ? 'email-confirmation-badge' : null"
            [attr.aria-invalid]="emailConfirmationErrorMessage ? 'true' : 'false'"
          />
        </div>
      </div>

      <div class="input-row">
        <div class="input-container">
          <app-badge
            class="badge"
            id="password-badge"
            [messages]="isInvalid('password') && !isPasswordFocused ? messages['password'] : null"
            [caret]="'left'"
          ></app-badge>

          <app-password-strength-feedback
            class="password-strength-feedback"
            [isPasswordFocused]="isPasswordFocused"
            [control]="accountSettingsForm.get('password')"
            [passwordFieldId]="'password'"
          ></app-password-strength-feedback>

          <div class="password-input-wrapper">
            <input
              class="input"
              id="password"
              [type]="isPasswordVisible ? 'text' : 'password'"
              name="password"
              (focus)="isPasswordFocused = true"
              (blur)="isPasswordFocused = false"
              formControlName="password"
              [placeholder]="translatePath + 'password' | translate"
              [attr.aria-label]="translatePathAriaLabel + 'password' | translate"
              [attr.aria-describedby]="isPasswordFocused ? 'password-requirements-description' : isInvalid('password') ? 'password-badge' : null"
              [attr.aria-invalid]="isInvalid('password')"
            />

            <app-password-toggle-button
              class="password-toggle-button"
              [isPasswordVisible]="isPasswordVisible"
              (passwordVisibilityChange)="isPasswordVisible = $event"
            ></app-password-toggle-button>
          </div>
        </div>

        <div class="input-container">
          <app-badge
            class="badge"
            id="password-confirmation-badge"
            [messages]="passwordConfirmationErrorMessage"
            [caret]="'left'"
          ></app-badge>

          <div class="password-input-wrapper">
            <input
              class="input"
              [type]="isPasswordVisible ? 'text' : 'password'"
              name="password_confirmation"
              (focus)="isPasswordFocused = true"
              (blur)="isPasswordFocused = false"
              formControlName="password_confirmation"
              [placeholder]="translatePath + 'passwordConfirmation' | translate"
              [attr.aria-label]="translatePathAriaLabel + 'passwordConfirmation' | translate"
              [attr.aria-describedby]="passwordConfirmationErrorMessage ? 'password-confirmation-badge' : null"
              [attr.aria-invalid]="passwordConfirmationErrorMessage ? 'true' : 'false'"
            />

            <app-password-toggle-button
              class="password-toggle-button"
              [isPasswordVisible]="isPasswordVisible"
              (passwordVisibilityChange)="isPasswordVisible = $event"
            ></app-password-toggle-button>
          </div>
        </div>
      </div>

      <span class="divider"></span>

      <div class="input-container">
        <app-badge
          class="badge"
          id="current-password-badge"
          [messages]="isInvalid('current_password') ? messages['current_password'] : null"
          [caret]="'left'"
        ></app-badge>

        <div class="password-input-wrapper">
          <input
            class="input"
            [type]="isPasswordVisible ? 'text' : 'password'"
            name="current_password"
            formControlName="current_password"
            autocomplete="current-password"
            [placeholder]="translatePath + 'currentPassword' | translate"
            [attr.aria-label]="translatePathAriaLabel + 'currentPassword' | translate"
            [attr.aria-describedby]="isInvalid('current_password') ? 'current-password-badge' : null"
            [attr.aria-invalid]="isInvalid('current_password')"
          />

          <app-password-toggle-button
            class="password-toggle-button"
            [isPasswordVisible]="isPasswordVisible"
            (passwordVisibilityChange)="isPasswordVisible = $event"
          ></app-password-toggle-button>
        </div>
      </div>

      <footer class="footer">
        <a
          [routerLink]="['/account-deletion']"
          class="link"
        >
          {{ translatePath + 'accountDeletion' | translate }}
        </a>
        <button
          class="submit-button"
          (click)="onSubmit()"
          [attr.aria-label]="translatePathAriaLabel + 'save' | translate"
        >
          <span
            class="icon-container"
            [innerHTML]="svgIconsService.returnIcon('save', 'action-icon')"
            aria-hidden="true"
          ></span>
          <span
            class="text"
            aria-hidden="true"
            >{{ translatePath + 'save' | translate }}</span
          >
        </button>
      </footer>
    </form>
  </section>
}
